name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          python -m compileall -q app || exit 1
          pip install ruff && ruff check app --output-format=concise || true

      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  comparison-data:
    name: Comparison data is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated comparison data matches script
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python ../scripts/update_comparison.py --dry-run > /tmp/out.txt
          echo "Generated summary:" && cat /tmp/out.txt
        # Real-world: diff data.json against a fresh build in a dedicated job.

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t null-backend:ci .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t null-frontend:ci .